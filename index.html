<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="shortcut icon" href="./assets/imgs/logo_syn_purple.png" type="image/x-icon">
    <title>Synergy</title>
</head>

<body>
    <div class="background-layer"></div>

    <div class="spacer-top"></div>

    <div class="network-box">
        <nav>
            <ul class="network-ul">
                <li class="network-item"><a href="https://www.youtube.com/TeamSynergyGG" target="_blank"><i
                            class="fa-brands fa-youtube"></i></a></li>
                <li class="network-item"><a href="instagram.com/Synergy.gg" target="_blank"><i
                            class="fa-brands fa-instagram"></i></a></li>
                <li class="network-item"><a href="https://x.com/TeamSynergy" target="_blank"><i
                            class="fa-brands fa-x-twitter"></i></a></li>
            </ul>
        </nav>
    </div>

    <div class="main-box">
        <img src="./assets/imgs/logo_syn_purple.png" alt="Logo Synergy" class="img-size">
        <div class="loading-line">
            <span>Loading</span>
            <span id="tw-app"></span>
        </div>
    </div>

    <div class="slider-box">
        <nav>
            <ul class="slider-ul">
                <li class="slider-dot">
                    <div class="dot-design selected" data-bg="./assets/imgs/1.jpg"></div>
                </li>
                <li class="slider-dot">
                    <div class="dot-design" data-bg="./assets/imgs/2.jpg"></div>
                </li>
                <li class="slider-dot">
                    <div class="dot-design" data-bg="./assets/imgs/3.jpg"></div>
                </li>
                <li class="slider-dot">
                    <div class="dot-design" data-bg="./assets/imgs/4.jpg"></div>
                </li>
            </ul>
        </nav>
    </div>

    <div class="footer-box">
        <p>© 2026 Synergy - Index made by <a href="https://x.com/EgzysDESIGN" target="_blank"> EgzysDESIGN</a></p>
    </div>

    <div class="spacer-bottom"></div>

    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="app.js"></script>
</body>

</html>
